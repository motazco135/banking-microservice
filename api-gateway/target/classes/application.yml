server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # api-docs routes — must be listed before wildcard routes so they match first
        - id: customer-service-docs
          uri: http://customer-service:8081
          predicates:
            - Path=/customers/v3/api-docs
          filters:
            - RewritePath=/customers/v3/api-docs, /v3/api-docs
        - id: account-service-docs
          uri: http://account-service:8082
          predicates:
            - Path=/accounts/v3/api-docs
          filters:
            - RewritePath=/accounts/v3/api-docs, /v3/api-docs
        - id: payment-service-docs
          uri: http://payment-service:8083
          predicates:
            - Path=/payments/v3/api-docs
          filters:
            - RewritePath=/payments/v3/api-docs, /v3/api-docs
        # business routes
        - id: customer-service
          uri: http://customer-service:8081
          predicates:
            - Path=/customers/**
        - id: account-service
          uri: http://account-service:8082
          predicates:
            - Path=/accounts/**
        - id: payment-service
          uri: http://payment-service:8083
          predicates:
            - Path=/payments/**

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Customer Service
        url: /customers/v3/api-docs
      - name: Account Service
        url: /accounts/v3/api-docs
      - name: Payment Service
        url: /payments/v3/api-docs
