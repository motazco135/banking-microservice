# =============================================================================
# Network Topology — ADL Enforcement
# =============================================================================
# ADL asserts: SERVICES have NO DIRECT DEPENDENCY on other SERVICES
#              $S.api is REACHABLE via api_gateway ONLY
#
# Enforcement strategy: no two backend services share any Docker network.
#   - customer-net  (internal): customer-service ↔ kafka, zookeeper, postgres
#   - account-net   (internal): account-service  ↔ kafka, zookeeper, postgres
#   - payment-net   (internal): payment-service  ↔ kafka, zookeeper, postgres
#   - gw-customer            : api-gateway       ↔ customer-service  (HTTP only)
#   - gw-account             : api-gateway       ↔ account-service   (HTTP only)
#   - gw-payment             : api-gateway       ↔ payment-service   (HTTP only)
#
# Result:
#   customer-service, account-service, payment-service share ZERO networks
#   → they cannot resolve each other's hostnames on any port.
#   Only api-gateway has a host-bound port (8080).
# =============================================================================

networks:
  customer-net:
    internal: true
  account-net:
    internal: true
  payment-net:
    internal: true
  gw-customer:
  gw-account:
  gw-payment:
  infra-external:   # non-internal — allows host port binding for postgres & kafka

services:

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - customer-net
      - account-net
      - payment-net

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    ports:
      - "9092:9092"   # internal (Docker services)
      - "9093:9093"   # external (host / tools like kafka-ui, kcat)
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - customer-net
      - account-net
      - payment-net
      - infra-external

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - customer-net
      - account-net
      - payment-net
      - infra-external

  # ---------------------------------------------------------------------------
  # Application Services
  # ---------------------------------------------------------------------------

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - customer-service
      - account-service
      - payment-service
    networks:
      - gw-customer
      - gw-account
      - gw-payment

  customer-service:
    build:
      context: ./customer_service
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: customer_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - customer-net
      - gw-customer

  account-service:
    build:
      context: ./account_service
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: account_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - account-net
      - gw-account

  payment-service:
    build:
      context: ./payment_service
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: payment_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - payment-net
      - gw-payment

volumes:
  postgres-data:
